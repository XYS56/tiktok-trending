name: fetch-tiktok

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Fetch trending hashtags from Tokchart
        run: |
          cat > fetch.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          function encodeTag(tag) {
            return encodeURIComponent(tag.replace(/^#/, ''));
          }

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ locale: 'en-US', viewport: { width: 1280, height: 1000 } });
            const items = [];
            const seen = new Set();

            const grab = async (url) => {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(9000);
              const rows = await page.$$eval('table tr', rs => rs.map(r => [...r.querySelectorAll('th,td')].map(c => (c.innerText || '').replace(/\s+/g, ' ').trim())));
              for (const cells of rows) {
                if (!cells || cells.length < 3) continue;
                const tag = (cells[1] || '').trim();
                if (!tag.startsWith('#')) continue;
                const name = tag.replace(/^#/, '').trim();
                if (!name || seen.has(name)) continue;
                seen.add(name);
                const growth = (cells[2] || '').trim();
                const m = /([0-9.]+)/.exec(growth);
                items.push({
                  title: name,
                  url: 'https://www.tiktok.com/tag/' + encodeTag(name),
                  hot: m ? Math.round(parseFloat(m[1])) : 0,
                  desc: 'TikTok 本周热门话题' + (growth ? ' · 周环比 ' + growth : ''),
                });
              }
            };

            try {
              await grab('https://tokchart.com/tiktok-trending-hashtags');
            } catch (e) {
              console.log('grab failed:', e.message);
            }

            await browser.close();
            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/tiktok.json', JSON.stringify({
              updated_at: new Date().toISOString(),
              source: 'tokchart.com/tiktok-trending-hashtags',
              count: items.length,
              items: items.slice(0, 30),
            }, null, 1), 'utf8');
            console.log('items', items.length);
          })();
          JS
          node fetch.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tiktok.json
          git diff --cached --quiet || git commit -m "data: update $(date -u +%FT%TZ)"
          git push