name: fetch-trending

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Fetch TikTok hashtags (Tokchart)
        run: |
          cat > fetch-tiktok.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          function encodeTag(tag) {
            return encodeURIComponent(tag.replace(/^#/, ''));
          }

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ locale: 'en-US', viewport: { width: 1280, height: 1000 } });
            const items = [];
            const seen = new Set();

            const grab = async (url) => {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(9000);
              const rows = await page.$$eval('table tr', rs => rs.map(r => [...r.querySelectorAll('th,td')].map(c => (c.innerText || '').replace(/\s+/g, ' ').trim())));
              for (const cells of rows) {
                if (!cells || cells.length < 3) continue;
                const tag = (cells[1] || '').trim();
                if (!tag.startsWith('#')) continue;
                const name = tag.replace(/^#/, '').trim();
                if (!name || seen.has(name)) continue;
                seen.add(name);
                const growth = (cells[2] || '').trim();
                const m = /([0-9.]+)/.exec(growth);
                items.push({
                  title: name,
                  url: 'https://www.tiktok.com/tag/' + encodeTag(name),
                  hot: m ? Math.round(parseFloat(m[1])) : 0,
                  desc: 'TikTok 本周热门话题' + (growth ? ' · 周环比 ' + growth : '')
                });
              }
            };

            try {
              await grab('https://tokchart.com/tiktok-trending-hashtags');
            } catch (e) {
              console.log('tokchart failed:', e.message);
            }
            await browser.close();

            fs.writeFileSync('data/tiktok.json', JSON.stringify({
              updated_at: new Date().toISOString(),
              source: 'tokchart.com',
              count: items.length,
              items
            }, null, 2) + '\n');
            console.log('tiktok items:', items.length);
          })();
          JS
          node fetch-tiktok.js

      - name: Fetch YouTube trending (dynamic Invidious)
        run: |
          cat > fetch-youtube.js <<'JS'
          const fs = require('fs');

          async function tryFetch(url, timeout = 12000) {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), timeout);
            try {
              const res = await fetch(url, {
                signal: c.signal,
                headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36' }
              });
              const text = await res.text();
              return { status: res.status, text };
            } finally {
              clearTimeout(t);
            }
          }

          (async () => {
            const items = [];
            const seen = new Set();
            const hosts = [];

            try {
              const r = await tryFetch('https://api.invidious.io/instances.json?sort_by=type,users', 15000);
              if (r.status === 200) {
                const arr = JSON.parse(r.text);
                for (const row of arr) {
                  const host = row[0];
                  const info = row[1] || {};
                  if (info.type === 'https' && info.api !== false) hosts.push(host);
                }
              }
            } catch (e) {
              console.log('instance list failed:', e.message);
            }
            if (!hosts.includes('yewtu.be')) hosts.unshift('yewtu.be');
            console.log('candidate hosts:', hosts.slice(0, 8).join(','));

            for (const host of hosts.slice(0, 8)) {
              try {
                const r = await tryFetch('https://' + host + '/api/v1/trending?region=US');
                if (r.status !== 200 || !r.text.trim().startsWith('[')) continue;
                const list = JSON.parse(r.text);
                for (const v of list) {
                  const title = (v.title || '').trim();
                  if (!title || seen.has(title)) continue;
                  seen.add(title);
                  items.push({
                    title,
                    url: 'https://www.youtube.com/watch?v=' + v.videoId,
                    hot: v.viewCount || '',
                    desc: ['YouTube 美国趋势', v.author || '', v.viewCount ? v.viewCount + ' views' : ''].filter(Boolean).join(' · ')
                  });
                  if (items.length >= 30) break;
                }
                if (items.length) {
                  console.log('youtube via ' + host + ':', items.length);
                  break;
                }
              } catch (e) {
                console.log('youtube host failed:', host, e.message);
              }
            }

            fs.writeFileSync('data/youtube.json', JSON.stringify({
              updated_at: new Date().toISOString(),
              source: 'invidious',
              count: items.length,
              items
            }, null, 2) + '\n');
            console.log('youtube items:', items.length);
          })();
          JS
          node fetch-youtube.js

      - name: Fetch X trends (getdaytrends)
        run: |
          cat > fetch-x.js <<'JS'
          const fs = require('fs');

          function decode(s) {
            return String(s)
              .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
              .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&#x27;/g, "'")
              .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n));
          }

          (async () => {
            const items = [];
            const seen = new Set();
            try {
              const res = await fetch('https://getdaytrends.com/', {
                headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36' }
              });
              const html = await res.text();
              console.log('getdaytrends status', res.status, 'len', html.length);
              const re = /<a[^>]+href="\/trend\/([^"\/]+)\/?"[^>]*>([^<]{1,120})<\/a>/g;
              let m;
              while ((m = re.exec(html)) !== null) {
                const slug = m[1];
                const name = decode(m[2]).trim();
                if (!name || name.length < 2 || seen.has(name)) continue;
                seen.add(name);
                items.push({
                  title: name,
                  url: 'https://getdaytrends.com/trend/' + encodeURIComponent(slug) + '/',
                  hot: '',
                  desc: 'X 全球趋势 · getdaytrends'
                });
                if (items.length >= 40) break;
              }
            } catch (e) {
              console.log('x failed:', e.message);
            }

            fs.writeFileSync('data/x.json', JSON.stringify({
              updated_at: new Date().toISOString(),
              source: 'getdaytrends.com',
              count: items.length,
              items
            }, null, 2) + '\n');
            console.log('x items:', items.length);
          })();
          JS
          node fetch-x.js

      - name: Probe YouTube alternates
        run: |
          cat > probe2.js <<'JS'
          const urls = [
            'https://yt.lemnoslife.com/noKey/videos?part=snippet&chart=mostPopular&regionCode=US&maxResults=5',
            'https://yt.lemnoslife.com/videos?part=snippet&chart=mostPopular&regionCode=US&maxResults=5',
            'https://piped-instances.kavin.rocks/',
            'https://inv.nadeko.net/api/v1/trending?region=US'
          ];
          (async () => {
            for (const u of urls) {
              try {
                const c = new AbortController();
                const t = setTimeout(() => c.abort(), 15000);
                const r = await fetch(u, { signal: c.signal, headers: { 'User-Agent': 'Mozilla/5.0 Chrome/131' } });
                clearTimeout(t);
                const text = await r.text();
                console.log('API2', u, r.status, text.length, text.slice(0, 200).replace(/\s+/g, ' '));
              } catch (e) {
                console.log('API2 FAIL', u, e.message);
              }
            }
          })();
          JS
          node probe2.js

      - name: Commit and push
        run: |
          git config user.name "hotboard-relay-bot"
          git config user.email "relay@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore: update trending relay $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
