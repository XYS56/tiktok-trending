name: fetch-tiktok

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Fetch trending hashtags
        run: |
          cat > fetch.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ locale: 'en-US', viewport: { width: 1280, height: 900 } });
            const out = [];
            const seen = new Set();
            const collect = async (url) => {
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(6000);
                const rows = await page.$$eval('a[href^="/tag/"]', as => as.map(a => ({
                  href: a.getAttribute('href'),
                  text: (a.innerText || '').replace(/\s+/g, ' ').trim(),
                })));
                for (const r of rows) {
                  const m = /^\/tag\/([^?\/]+)/.exec(r.href || '');
                  if (!m) continue;
                  const name = decodeURIComponent(m[1]).replace(/^#/, '');
                  if (!name || seen.has(name)) continue;
                  seen.add(name);
                  out.push({ title: name, hot: 0 });
                }
              } catch (e) {
                console.log('fail', url, e.message);
              }
            };
            await collect('https://www.tiktok.com/discover');
            if (out.length < 12) await collect('https://www.tiktok.com/');
            await browser.close();
            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/tiktok.json', JSON.stringify({
              updated_at: new Date().toISOString(),
              source: 'www.tiktok.com rendered',
              items: out.slice(0, 40),
            }, null, 1), 'utf8');
            console.log('items', out.length);
          })();
          JS
          node fetch.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tiktok.json
          git diff --cached --quiet || git commit -m "data: update $(date -u +%FT%TZ)"
          git push