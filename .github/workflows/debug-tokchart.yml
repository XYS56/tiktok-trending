name: debug-tokchart

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Render tokchart
        run: |
          cat > probe.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ locale: 'en-US' });
            await p.goto('https://tokchart.com/tiktok-trending-hashtags', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(9000);
            const rows = await p.$$eval('table tr', rs => rs.map(r => (r.innerText || '').replace(/\s+/g, ' ').trim()).filter(Boolean));
            console.log('ROWS', rows.length);
            rows.slice(0, 30).forEach((r, i) => console.log('ROW' + i + ':' + r.slice(0, 120)));
            const tags = await p.$$eval('a[href*="hashtag"]', as => as.map(a => a.getAttribute('href') + ' | ' + (a.innerText || '').replace(/\s+/g, ' ').trim()));
            console.log('TAGS', tags.length);
            tags.slice(0, 20).forEach(t => console.log('TAG:' + t.slice(0, 120)));
            await b.close();
          })();
          JS
          node probe.js