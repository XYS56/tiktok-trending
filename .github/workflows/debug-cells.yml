name: debug-cells

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Cells
        run: |
          cat > probe.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ locale: 'en-US' });
            await p.goto('https://tokchart.com/tiktok-trending-hashtags', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(9000);
            const rows = await p.$$eval('table tr', rs => rs.map(r => [...r.querySelectorAll('th,td')].map(c => (c.innerText || '').replace(/\s+/g, ' ').trim())));
            console.log('N=' + rows.length);
            rows.slice(0, 8).forEach((r, i) => console.log('R' + i + '=' + JSON.stringify(r)));
            await b.close();
          })();
          JS
          node probe.js